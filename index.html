<!DOCTYPE html>
<head>
  <title>Number Line</title>
  <meta charset="utf-8">
  <link href="jsPsych-7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />

  <script type="text/javascript" src="./locale/localizer.js"></script>
  <script type="text/javascript" src="./locale/fr-child.js"></script>
  <script type="text/javascript"> const localizer = new ChildFrenchLocalizer(); </script>
</head>
<body>
  <script type="text/javascript">

    //const queryDict = {};
    queryDict = {};
    location.search.substr(1).split("&").forEach(function(item) {queryDict[item.split("=")[0]] = item.split("=")[1]})

    // Start by getting an ID for the participant if needed.
    const USE_RANDOM_ID = false

    if (queryDict.id == undefined){
      window.location.replace(`./common/src/identification.html?useRandomID=${USE_RANDOM_ID}`);
    } else {

      // Name of the folder
      let order =  ["demographics-task", "number-to-line-task", "standard-exercises-task"]

      // TODO Dynamic file selection.
      let config_files = queryDict.debug != undefined ? ["", "minimal_debug", "debug"] : ["", "tests-2025-2026", "exercises"]


      let newTaskIndex = queryDict.lastTask != undefined ? order.indexOf(queryDict.lastTask) + 1 : 0;

      const SESSION = 1
      // TODO BEWARE OF "&" in queries
      let queriesToPass = `?id=${queryDict.id}&file=${config_files[newTaskIndex]}&session=${SESSION}`;

      if (newTaskIndex >= order.length){
        document.body.innerHTML = localizer.getMessage("EXPERIMENT_END_MESSAGE", [], "p");
      } else {
        window.location.replace(`./${order[newTaskIndex]}/experiment.html${queriesToPass}`);
      }
    }
  </script>
</body>
