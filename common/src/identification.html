<!DOCTYPE html>
<head>
  <title>Identification step</title>
  <meta charset="utf-8">
  <link href="../../libraries/jsPsych-7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="./query-dict.js" charset="utf-8"></script>

  <script src="../../locale/localizer.js" charset="utf-8"></script>
  <script src="../../locale/fr-child.js" charset="utf-8"></script>

  <script src="../../libraries/jsPsych-7.3.0/jspsych.js" charset="utf-8"></script>
  <script src="../../libraries/jsPsych-7.3.0/plugins/plugin-survey-text.js" charset="utf-8"></script>
  <script src="../../libraries/jsPsych-7.3.0/plugins/plugin-instructions.js" charset="utf-8"></script>
</head>
<body>
  <script type="text/javascript">
    function createIdentificationProcedure(jsPsych, localizer){
      let placeholderID = ""

      let idSurvey = {
        type: jsPsychSurveyText,
        questions: [
          {prompt: localizer.getMessage("ID_QUERY"), required: true},
        ],
        preamble: function(){return placeholderID == "" ? "" :
          `<p style='color: red;'>Cet identifiant n'est pas le bon, réessaye !</p>
          <p>Tu avais entré : <b>${placeholderID}</b></p>
          `},
        on_finish: function(data){
          let trialsData = jsPsych.data.get().trials;
          let lastTrial = trialsData[trialsData.length - 1]

          // Define the subject ID...
          subjectID = lastTrial.response.Q0;
          jsPsych.data.addProperties({'ID': subjectID});

          // Apply it retroactively for cleanliness
          lastTrial.ID = subjectID;
        }
      };

      let idSurveyProcedure = {
        timeline: [idSurvey],
        loop_function: function(data){
            console.log(jsPsych.data)
            let id = data.values()[0].response.Q0.toUpperCase()
            placeholderID = id;
            let isIdOkay = /^(N|([AV])\2{2}_2526_[A-Z]{3}_G(\d)\3{2}_(\d\d)\4{2}|DEBUG.*)$/.test(id)
            if(isIdOkay){
                return false;
            } else {
                return true;
            }
        }
      }

      return idSurveyProcedure
  }

    // TODO NavigationUtils
    function returnToIndex(){
      window.location.replace(`../../index.html?id=${subjectID}`)
    }

    const queryDict = QueryDict.readQueries()
    const localizer = new ChildFrenchLocalizer()

    let subjectID;

    const jsPsych = initJsPsych({
      on_finish: function(data){
        returnToIndex();
      }
    })

    let timeline = [];

    if (QueryDict.parseBoolean(queryDict.useRandomID)){
      // Generate a random ID
      subjectID = jsPsych.randomization.randomID(4);
      timeline.push={
        type:jsPsychInstructions,
        pages: [`<p>${localizer.getMessage("RANDOM_ID_GENERATED", subjectID)}</p>`],
        button_label_next: localizer.getMessage("NEXT")
      };
      // TODO, here we could have a small trial that indicates the ID.
      returnToIndex();
    } else {
      // Add a trial asking for ID
      timeline.push(createIdentificationProcedure(jsPsych, localizer));

      jsPsych.run(timeline)
    }

  </script>
</body>
