<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Fraction Survey Example</title>

    <!-- Load jsPsych -->
    <script type="text/javascript" src="../libraries/jsPsych-7.3.0/jspsych.js"></script>
    <script type="text/javascript" src="../libraries/jsPsych-7.3.0/plugins/plugin-survey-html-form.js"></script>
    <!-- Old version -->
    <!-- <script type="text/javascript" src="../libraries/jsPsych-7.3.0/plugins/plugin-survey.js"></script> -->
    <script src="https://unpkg.com/@jspsych/plugin-survey@3.0.0"></script>
    <link href="../libraries/jsPsych-7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://unpkg.com/@jspsych/plugin-survey@3.0.0/css/survey.min.css">

    <script type="text/javascript" src="./survey-fraction.js"></script>
  </head>
  <body></body>

  <script type = "module">
    // NB : this is asynchronous and probably requires localhost.
    // let EXPERIMENT_CONFIG = await fetch(`../config/standard-exercises-task/${queryDict.file}.json`).then(r => r.json());
    let EXPERIMENT_CONFIG = await fetch(`../config/standard-exercises-task/exercises.json`).then(r => r.json());


    function createSurveyOptions(options) {
      let optionsDivs = options.map(o =>  `
        <div class="option-container">
          <label class="fraction-label">
            ${o.html}
            <input type="radio" name="fraction" value="${o.value}" required>
          </label>
        </div>
      `)

      return `
        <div class="options-container">
          ${optionsDivs.join("\n")}
        </div>
      `
    }

    // ---------- jsPsych setup ----------

    const jsPsych = initJsPsych({
      // on_finish: () => jsPsych.data.displayData(),
    });

    const fractionList = [
      [1, 2],
      [2, 3],
      [3, 4],
      [5, 6],
    ].map(([n,d]) => {return {html: createFractionHTML(n, d), value: `${n}/${d}`}});

    const fractionQuestion = {
      type: jsPsychSurveyHtmlForm,
      preamble: "<h3>Select the fraction you prefer:</h3>",
      html: createSurveyOptions(fractionList),
      button_label: "Submit",
    };


    // --------- Fraction input HTML ----------
     const fractionInputHTML = `
      <div class="options-container" style="display:flex">
        <div style="display:flex; align-items: center;"><p style="text-align: center">
          1/2 + 1/2 =
        </p></div>
        <div class="fraction-input">
          <input type="number" id="num" name="numerator" placeholder=" " required>
          <div class="fraction-line"></div>
          <input type="number" id="den" name="denominator" placeholder=" " required>
        </div>
        <div id="error" class="error-msg">Please enter valid numbers for numerator and denominator.</div>
      </div>
    `;

     // --------- Trial definition ----------
     const inputTrial = {
       type: jsPsychSurveyHtmlForm,
       preamble: "<h3>Enter your own fraction:</h3>",
       html: fractionInputHTML,
       button_label: "Submit",
       on_load: () => {
         document.getElementById("jspsych-survey-html-form")
       }
     };

    let timeline = []
    for (let exercise_config of EXPERIMENT_CONFIG.exercises){
      let exercise_procedure = null;
      switch (exercise_config.name) {
        case "fraction_selection":
          exercise_procedure = generate_fraction_selection_exercise(exercise_config.items, true)
          break;
        default:
          console.error(`Invalid exercise name: ${exercise_config.name}. Skipping...`)
          continue;
      }

      timeline = timeline.concat(exercise_procedure)
    }

    function generate_fraction_selection_exercise(items, randomize = false){
      let jsons = []
      for(let item of items){
        let choices = [];
        for (let choice of item.choices){
          choices.push({
            value: `${choice.target} - ${choice.model}`,
            imageLink: `./res/fraction-images/${choice.filename}.png`,
            text: null
          })
        }

        let components = item.target.split("/");
        let numerator = components[0];
        let denominator = components[1];

        let json = {
          "elements": [
             {
               type: "imagepicker",
               name: "fractions",
               // Not working, because the text is wrapped in a span of class "sv-string-viewer" which displays html as plain text.
               // "title": `Choisis la fraction qui correspond à ${createFractionHTML(numerator, denominator)}`,
               title: `Choisis la fraction qui correspond à ${item.target}`,
               description: "",
               isRequired: true,
               choices: choices,
               showLabel: false,
               multiSelect: false,
               imageWidth: 200,
               imageHeight: 200
             }
          ]
        };

        jsons.push(json)
      }

      if (randomize)
        jsons = jsPsych.randomization.shuffle(jsons)

      let timeline = []
      for (let json of jsons){
        let surveyTrial = {
         type: jsPsychSurvey,
         survey_json: {
           title: null,
           completeText: 'Suivant',
           pages: [json]
         },
         on_finish: function(data){
           document.getElementById("jspsych-content").innerHTML = ""
         }
        };

        timeline.push(surveyTrial)
      }

      return {timeline: timeline};
    }


     console.log('test')
    jsPsych.run(timeline)
    // jsPsych.run([surveyTrial]);
    // jsPsych.run([inputTrial]);
    // jsPsych.run([fractionQuestion]);
  </script>
</html>
