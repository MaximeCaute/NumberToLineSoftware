<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Fraction Survey Example</title>

    <!-- QueryDict.load returns the list of queries. -->
    <script type="text/javascript" src="../common/src/query-dict.js"></script>
    <script type="text/javascript"> const queryDict = QueryDict.readQueries() </script>

    <!-- Saving stuff -->
    <script type="text/javascript" src="../common/src/utils/saving-utils.js"></script>
    <script type="text/javascript" src="../common/src/utils/math-utils.js"></script>

    <!-- Load jsPsych -->
    <script type="text/javascript" src="../libraries/jsPsych-7.3.0/jspsych.js"></script>
    <script type="text/javascript" src="../libraries/jsPsych-7.3.0/plugins/plugin-survey-html-form.js"></script>
    <script type="text/javascript" src="../libraries/jsPsych-7.3.0/plugins/plugin-survey-multi-choice.js"></script>
    <!-- Helpers -->
    <script type="text/javascript" src="./src/exercise-generators.js"></script>
    <!-- TODO math should be in common helpers! -->
    <script type="text/javascript" src="../number-to-line-task/src/math/rational.js"></script>
    <!-- TODO move into exercise generator? -->
    <script type="text/javascript" src="./survey-fraction.js"></script>
    <!-- <script type="text/javascript" src="../libraries/jsPsych-7.3.0/plugins/plugin-survey.js"></script> -->
    <script src="https://unpkg.com/@jspsych/plugin-survey@3.0.0"></script>
    <link href="../libraries/jsPsych-7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://unpkg.com/@jspsych/plugin-survey@3.0.0/css/survey.min.css">

  </head>
  <body></body>

  <script type = "module">

    let subjectID = queryDict.id;

    // NB : this is asynchronous, which requires the file to be opened via a server (possibly local).
    let EXPERIMENT_CONFIG = await fetch(`../config/standard-exercises-task/${queryDict.file}.json`).then(r => r.json());

    // ---------- jsPsych setup ----------

    const jsPsych = initJsPsych({
      on_finish: function(data)
      {
        let currentFolderName = window.location.href.split("/").reverse()[1];
        if (!queryDict.save)
          SavingUtils.saveLocal(jsPsych, `${subjectID}_${currentFolderName}_${queryDict.session}`);
          SavingUtils.saveDataPHP(`${subjectID}_${currentFolderName}_${queryDict.session}`, data)
        // window.location.replace(`../index.html?id=${subjectID}&lastTask=${currentFolderName}`);
      }
    });

    let exerciseGenerator = new ExerciseGenerator(jsPsych);

    let timeline = []
    // TODO should probably move to ExerciseGenerator class
    for (let exerciseConfig of EXPERIMENT_CONFIG.exercises){
      let exerciseProcedure = null;
      switch (exerciseConfig.name) {
        case "integer_arithmetic":
          exerciseProcedure = exerciseGenerator.generateIntegerArithmeticExerciseProcedure(exerciseConfig.items, exerciseConfig.randomize)
          break;
        case "fraction_addition":
          switch(exerciseConfig.choice){
            case "free":
              exerciseProcedure = exerciseGenerator.generateFreeChoiceFractionAdditionExerciseProcedure(exerciseConfig.items, exerciseConfig.randomize)
              break;
            case "forced":
              exerciseProcedure = exerciseGenerator.generateForcedChoiceFractionAdditionExerciseProcedure(exerciseConfig.items, exerciseConfig.randomize)
              break;
            default:
              console.error(`Invalid choice type: ${exerciseConfig.choice}. Skipping...`);
              continue;
          }
          break;
        case "fraction_comparison":
          exerciseProcedure = exerciseGenerator.generateFractionComparisonExerciseProcedure(exerciseConfig.items, exerciseConfig.randomize)
          break;
        case "fraction_bracketting":
          exerciseProcedure = exerciseGenerator.generateFractionBrackettingExerciseProcedure(exerciseConfig.items, exerciseConfig.randomize)
          break;
        // Requires network connection
        case "fraction_selection":
          exerciseProcedure = exerciseGenerator.generateFractionSelectionExerciseProcedure(exerciseConfig.items, exerciseConfig.randomize)
          break;
        default:
          console.error(`Invalid exercise name: ${exerciseConfig.name}. Skipping...`)
          continue;
      }

      timeline = timeline.concat(exerciseProcedure)
    }



    jsPsych.run(timeline)
  </script>
</html>
